# =====================================================================
#  CD - REUSABLE WORKFLOW (Build + ECR + Deploy SSH ou ECS)
#
#  Este arquivo vive em:
#      ebravo-br/cicd-templates/.github/workflows/cd.yml
#
#  Invocado pelo stub de cada repo via:
#      jobs.cd.uses: ebravo-br/cicd-templates/.github/workflows/cd.yml@v1
#
#  Trigger: apenas workflow_dispatch (gate manual — deploy e sempre intencional).
#
#  Realiza em sequencia por componente (max-parallel: 1):
#    1. Bump de versao (calcula + atualiza arquivo local)
#    2. Build (compile/package ja com a nova versao)
#    3. Commit do bump [skip ci]
#    4. Build e push da imagem Docker -> ECR
#    5. Deploy SSH -> EC2
#
#  Formato de versao gerado:
#    homologacao  ->  {versao}-B{run}-{tipo}{issue}
#                     Ex: 1.52.0-B34-F1   (Build 34, Feature issue 1)
#                         1.52.0-B2-B55   (Build 2, Bug issue 55)
#                         1.52.0-B199-T88 (Build 199, Task issue 88)
#                     B = numero sequencial do workflow run (github.run_number)
#                     F = Feature  (branch feature/{N})
#                     B = Bug      (branch bug/{N})
#                     T = Task     (branch task/{N})
#                     Fallback (branch sem padrao): {versao}-B{run}
#    producao     ->  bump do minor: 1.52.0 -> 1.53.0
#
#  Tag/Release (apenas producao):
#    single-repo  ->  {versao}          (ex: 1.53.0)
#    monorepo     ->  {app}/{versao}    (ex: api/1.97.0, web/1.92.0)
#    A imagem no ECR usa sempre {componente}:{versao} (sem prefixo).
# =====================================================================

name: CD - Reusable (Build + ECR + Deploy)

on:
  workflow_call:
    inputs:
      target_env:
        description: 'homologacao | producao'
        type: string
        required: true
      deploy_platform:
        description: 'ec2 (ativo) | ecs | gke (futuros)'
        type: string
        required: false
        default: ec2
      deploy_apps:
        description: 'Componentes a deployar (monorepo): ambos | api | web'
        type: string
        required: false
        default: ambos
    secrets:
      # Deixaram de ser obrigatorios: quando a variavel AWS_DEPLOY_ROLE_ARN
      # existe, a autenticacao e por OIDC e nao ha access key nenhuma.
      # Ver V6 em ebravo-br/ebravo-infra, docs/05.
      AWS_ACCESS_KEY_ID:
        required: false
      AWS_SECRET_ACCESS_KEY:
        required: false
      # Idem: so o caminho `ec2` usa SSH.
      SSH_KEY_HOMOL:
        required: false
      SSH_KEY_PROD:
        required: false
      GH_TOKEN_BUMP:
        required: false
      # Faltava aqui, e so aparece quando o repositorio que chama esta em OUTRA
      # organizacao. Dentro da ebravo-br o `secrets: inherit` do stub entrega
      # ate o que nao esta declarado, entao o cd.yml funcionou por quatro
      # repositorios sem esta linha. A tramar-br chama este mesmo workflow de
      # fora, e ali o `inherit` nao vale -- a documentacao do GitHub limita o
      # keyword a "the same organization or enterprise". O stub de la passa os
      # segredos nome a nome, e passagem explicita so alcanca o que o
      # workflow_call declara.
      #
      # Sintoma, no primeiro deploy do tramar-pedidos em 2026-09-14:
      #   Error: Input required and not supplied: private-key
      #
      # O PR #11 declarou este mesmo segredo no branch-naming, no issue-epic e
      # no project-automation; o cd.yml ficou de fora.
      APP_AUTOMACAO_PRIVATE_KEY:
        required: false

permissions:
  contents: write
  id-token: write
  pull-requests: write

env:
  AWS_REGION:     sa-east-1
  DEFAULT_NODE:   '20'
  DEFAULT_JDK:    '17'
  DEFAULT_PYTHON: '3.12'

jobs:
  # ===================================================================
  # 0. CHECK-PERMISSION — bloqueia deploy em producao se nao autorizado
  # ===================================================================
  check-permission:
    name: Verificar permissao
    runs-on: ubuntu-latest
    steps:
      - name: Bloquear deploy em producao para usuarios nao autorizados
        if: inputs.target_env == 'producao'
        env:
          ACTOR:   ${{ github.actor }}
          ALLOWED: ${{ vars.DEPLOY_PROD_ALLOWED }}
        run: |
          if [ -z "$ALLOWED" ]; then
            echo "::error::Variavel DEPLOY_PROD_ALLOWED nao configurada na org. Contate o administrador."
            exit 1
          fi
          if echo " $ALLOWED " | grep -qw "$ACTOR"; then
            echo "::notice::Permissao concedida: $ACTOR pode fazer deploy em producao."
          else
            echo "::error::Usuario '$ACTOR' nao tem permissao para deploy em producao. Lista de autorizados: $ALLOWED"
            exit 1
          fi

  # ===================================================================
  # 1. SETUP — le .github/pipeline.yml e monta a matrix
  # ===================================================================
  setup:
    name: Setup • parse .github/pipeline.yml
    needs: check-permission
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.props.outputs.matrix }}
      ref:    ${{ steps.ref.outputs.ref }}
    steps:
      - name: Definir ref de checkout
        id: ref
        run: |
          if [ "${{ github.event_name }}" = "pull_request_review" ]; then
            echo "ref=${{ github.event.pull_request.head.ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.ref }}

      - name: Parse .github/pipeline.yml -> matrix
        id: props
        shell: bash
        env:
          DEFAULT_PYTHON: ${{ env.DEFAULT_PYTHON }}
          DEPLOY_APPS:    ${{ inputs.deploy_apps }}
        run: |
          set -euo pipefail
          [ -f .github/pipeline.yml ] || { echo "::error::.github/pipeline.yml nao encontrado"; exit 1; }

          python3 - <<'PY'
          import yaml, json, os, sys

          cfg = yaml.safe_load(open('.github/pipeline.yml'))
          out = open(os.environ['GITHUB_OUTPUT'], 'a')
          dp  = os.environ.get('DEFAULT_PYTHON', '3.12')

          def g(d, *keys, default=''):
              for k in keys:
                  d = (d or {}).get(k)
                  if d is None:
                      return default
              return str(d) if d is not None else default

          def version_file(tec, base):
              m = {'spring-boot-java': 'pom.xml', 'java': 'pom.xml', 'python': 'pyproject.toml'}
              f = m.get(tec, 'package.json')
              return f'{base}/{f}'.lstrip('./')

          # Componentes do monorepo: vem do PROPRIO pipeline.yml, nao de uma
          # lista fixa aqui dentro.
          #
          # Antes era `for app in ('api', 'web')` -- dois nomes cravados no
          # workflow. Quem declarasse um terceiro componente nao recebia erro:
          # o laco simplesmente nunca visitava a chave, nenhum job era criado,
          # e o deploy terminava VERDE sem ter deployado. E o pior modo de
          # falha que existe (ebravo-infra, docs/03).
          #
          # Descoberto ao migrar o ebravo-signer, que tem api (NestJS), web
          # (Next.js) e worker (Python) -- tres componentes, com os tres
          # repositorios ECR ja existentes.
          #
          # ADITIVO: um pipeline.yml com api+web produz exatamente a mesma
          # matriz de antes.
          RESERVADAS = {'monorepo', 'componente', 'tecnologia', 'jdk', 'node', 'python'}

          def componentes_declarados(cfg):
              return [k for k, v in cfg.items()
                      if k not in RESERVADAS and isinstance(v, dict) and v.get('componente')]
          mono  = str(cfg.get('monorepo', False)).lower() == 'true'
          items = []

          if mono:
              declarados = componentes_declarados(cfg)
              if not declarados:
                  print('::error::monorepo: true mas nenhum componente declarado em .github/pipeline.yml', file=sys.stderr); sys.exit(1)
              deploy_apps_raw = os.environ.get('DEPLOY_APPS', 'ambos').strip().lower()
              if deploy_apps_raw in ('', 'ambos', 'todos'):
                  deploy_apps = set(declarados)
              else:
                  deploy_apps = {a.strip() for a in deploy_apps_raw.split(',') if a.strip()}
                  # Pedir componente inexistente passa a ser ERRO. Antes,
                  # `deploy_apps: worker` num repo api+web dava matriz vazia e
                  # deploy verde sem deployar nada.
                  fora = deploy_apps - set(declarados)
                  if fora:
                      print(f'::error::deploy_apps pede {sorted(fora)}, nao declarado em .github/pipeline.yml. Declarados: {sorted(declarados)}', file=sys.stderr)
                      sys.exit(1)
              for app in declarados:
                  if app not in deploy_apps:
                      continue
                  if app not in deploy_apps:
                      continue
                  sub  = cfg.get(app) or {}
                  comp = g(sub, 'componente')
                  tec  = g(sub, 'tecnologia')
                  if not comp or not tec:
                      continue
                  df = g(sub, 'dockerfile') or f'infra/docker/{app}/Dockerfile'
                  if not os.path.isfile(df):
                      print(f'::error::{df} nao existe', file=sys.stderr); sys.exit(1)
                  items.append({
                      'app': app, 'componente': comp, 'tecnologia': tec,
                      'node': g(sub,'node'), 'jdk': g(sub,'jdk'),
                      'python': g(sub,'python') or dp,
                      # Contexto e Dockerfile declaraveis, com o padrao de antes.
                      #
                      # O default `apps/<app>` serve monorepo cujo app e
                      # autocontido -- ebcare, datapat, tramar-pedidos. Nao
                      # serve monorepo com workspace compartilhado: o
                      # ebravo-signer tem `COPY packages/shared` e
                      # `COPY package-lock.json` nos tres Dockerfiles, que so
                      # resolvem a partir da RAIZ. Com contexto `apps/api` o
                      # build quebra no COPY, nao no deploy.
                      'context': g(sub, 'context') or f'apps/{app}', 'dockerfile': df,
                      'version_file': version_file(tec, f'apps/{app}'),
                      'monorepo': 'true',
                  })
          else:
              comp = g(cfg, 'componente')
              tec  = g(cfg, 'tecnologia')
              if not comp: print('::error::componente ausente em .github/pipeline.yml', file=sys.stderr); sys.exit(1)
              if not tec:  print('::error::tecnologia ausente em .github/pipeline.yml', file=sys.stderr); sys.exit(1)
              if os.path.isfile('infra/docker/Dockerfile'):
                  df  = 'infra/docker/Dockerfile'
                  app = 'api' if tec in ('spring-boot-java', 'java', 'python') else 'web'
              elif os.path.isfile('infra/docker/api/Dockerfile'):
                  df, app = 'infra/docker/api/Dockerfile', 'api'
              elif os.path.isfile('infra/docker/web/Dockerfile'):
                  df, app = 'infra/docker/web/Dockerfile', 'web'
              else:
                  print('::error::Dockerfile nao encontrado. Esperado: infra/docker/Dockerfile', file=sys.stderr); sys.exit(1)
              items.append({
                  'app': app, 'componente': comp, 'tecnologia': tec,
                  'node': g(cfg,'node'), 'jdk': g(cfg,'jdk'),
                  'python': g(cfg,'python') or dp,
                  'context': '.', 'dockerfile': df,
                  'version_file': version_file(tec, '.'),
                  'monorepo': 'false',
              })

          if not items:
              print('::error::nenhum componente em .github/pipeline.yml', file=sys.stderr); sys.exit(1)

          out.write(f"matrix={json.dumps({'include': items})}\n")
          print(json.dumps({'include': items}, indent=2))
          PY

  # ===================================================================
  # 2. DEPLOY — build + bump + ECR + SSH (um componente por vez)
  # ===================================================================
  deploy:
    name: Deploy ${{ inputs.target_env }} • ${{ matrix.componente }}
    needs: [check-permission, setup]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    environment:
      name: ${{ inputs.target_env }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.setup.outputs.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # Token do GitHub App, no lugar do GH_TOKEN_BUMP.
      #
      # O bump de versao e commitado em branch protegida. Hoje isso passa
      # porque o PAT pertence a alguem com admin e `enforce_admins: false` — o
      # bypass depende do status administrativo de uma PESSOA, e o commit sai
      # atribuido a ela, como se tivesse commitado a mao. Com o App o bypass e
      # declarado na propria branch protection e o commit fica no nome do App.
      #
      # Gateado por `vars.APP_AUTOMACAO_ID`, igual ao ramo OIDC da AWS: vazio,
      # cai no PAT e o comportamento e o de antes.
      - name: Token do App
        id: token
        if: vars.APP_AUTOMACAO_ID != ''
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.APP_AUTOMACAO_ID }}
          private-key: ${{ secrets.APP_AUTOMACAO_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Configurar identidade Git
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      # ---- Toolchain --------------------------------------------------
      - if: matrix.tecnologia == 'nodejs' || matrix.tecnologia == 'angular' || matrix.tecnologia == 'react'
        id: nodever
        run: |
          NV="${{ matrix.node }}"; NV="${NV#node}"
          echo "v=${NV:-${{ env.DEFAULT_NODE }}}" >> "$GITHUB_OUTPUT"

      - if: matrix.tecnologia == 'nodejs' || matrix.tecnologia == 'angular' || matrix.tecnologia == 'react'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.nodever.outputs.v }}

      - if: matrix.tecnologia == 'spring-boot-java' || matrix.tecnologia == 'java'
        id: jdkver
        run: |
          JV="${{ matrix.jdk }}"; JV="${JV#jdk}"
          echo "v=${JV:-${{ env.DEFAULT_JDK }}}" >> "$GITHUB_OUTPUT"

      - if: matrix.tecnologia == 'spring-boot-java' || matrix.tecnologia == 'java'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.jdkver.outputs.v }}
          cache: maven

      - if: matrix.tecnologia == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # ---- Bump de versao ---------------------------------------------
      - name: Calcular nova versao
        id: ver
        env:
          VERSION_FILE: ${{ matrix.version_file }}
          TEC:          ${{ matrix.tecnologia }}
          ENV_TARGET:   ${{ inputs.target_env }}
          RUN_NUMBER:   ${{ github.run_number }}
          HEAD_REF:     ${{ needs.setup.outputs.ref }}
        run: |
          set -euo pipefail
          case "$TEC" in
            spring-boot-java|java)
              CUR=$(python3 - <<'PY'
          import os, re
          # Versao do PROJETO = <version> do cabecalho (antes de properties/dependencies/build),
          # ignorando o bloco <parent>. Robusto a qualquer ordem dos elementos no pom.
          src = open(os.environ['VERSION_FILE']).read()
          m_sec = re.search(r'<(?:properties|dependencies|dependencyManagement|build|profiles)[\s>]', src)
          header_end = m_sec.start() if m_sec else len(src)
          parent = re.search(r'<parent\b.*?</parent>', src, re.DOTALL)
          pspan = (parent.start(), parent.end()) if parent else None
          ver = ''
          for vm in re.finditer(r'<version>([^<]+)</version>', src):
              if vm.start() >= header_end:
                  break
              if pspan and pspan[0] <= vm.start() < pspan[1]:
                  continue
              ver = vm.group(1).strip()
              break
          print(ver)
          PY
          )
              ;;
            python)                CUR=$(grep -m1 -oP '(?<=^version *= *")[^"]+' "$VERSION_FILE") ;;
            *)                     CUR=$(node -p "require('./'+process.env.VERSION_FILE).version") ;;
          esac
          # Strips both old (-SNAPSHOT.TIMESTAMP) and new (-B{N}-{L}{N}) pre-release suffixes
          BASE=$(echo "$CUR" | sed -E 's/(-SNAPSHOT[._][0-9]+|-B[0-9]+(-[FBT][0-9]+)?)$//')
          if [ "$ENV_TARGET" = "homologacao" ]; then
            # Formato: {versao}-B{run_number}-{tipo}{issue}
            #   B = Build (numero sequencial do workflow run)
            #   F = Feature  (branch feature/{N})
            #   B = Bug      (branch bug/{N})
            #   T = Task     (branch task/{N})
            TYPE_LETTER=""
            ISSUE_NUM=""
            if   [[ "$HEAD_REF" =~ ^feature/([0-9]+)$ ]]; then TYPE_LETTER="F"; ISSUE_NUM="${BASH_REMATCH[1]}"
            elif [[ "$HEAD_REF" =~ ^bug/([0-9]+)$ ]];     then TYPE_LETTER="B"; ISSUE_NUM="${BASH_REMATCH[1]}"
            elif [[ "$HEAD_REF" =~ ^task/([0-9]+)$ ]];    then TYPE_LETTER="T"; ISSUE_NUM="${BASH_REMATCH[1]}"
            fi
            if [ -n "$TYPE_LETTER" ]; then
              NEW="${BASE}-B${RUN_NUMBER}-${TYPE_LETTER}${ISSUE_NUM}"
            else
              NEW="${BASE}-B${RUN_NUMBER}"
            fi
          else
            IFS='.' read -r A B C <<<"$BASE"
            NEW="${A}.$((B+1)).0"
          fi
          echo "current=$CUR" >> "$GITHUB_OUTPUT"
          echo "new=$NEW"     >> "$GITHUB_OUTPUT"
          echo "::notice::$VERSION_FILE  $CUR -> $NEW  ($ENV_TARGET)"

      - name: Atualizar arquivo de versao
        env:
          VERSION_FILE: ${{ matrix.version_file }}
          TEC:          ${{ matrix.tecnologia }}
          NEW:          ${{ steps.ver.outputs.new }}
        run: |
          set -euo pipefail
          case "$TEC" in
            spring-boot-java|java)
              python3 - <<'PY'
          import os, re, sys
          fp = os.environ['VERSION_FILE']; new = os.environ['NEW']
          src = open(fp).read()
          # Troca apenas o <version> do PROJETO (cabecalho, fora de <parent> e de dependencias)
          m_sec = re.search(r'<(?:properties|dependencies|dependencyManagement|build|profiles)[\s>]', src)
          header_end = m_sec.start() if m_sec else len(src)
          parent = re.search(r'<parent\b.*?</parent>', src, re.DOTALL)
          pspan = (parent.start(), parent.end()) if parent else None
          target = None
          for vm in re.finditer(r'(<version>)([^<]+)(</version>)', src):
              if vm.start() >= header_end:
                  break
              if pspan and pspan[0] <= vm.start() < pspan[1]:
                  continue
              target = vm
              break
          if target is None:
              print('::warning::Nao encontrei <version> do projeto no pom.xml; arquivo nao alterado.', file=sys.stderr)
          else:
              src = src[:target.start()] + target.group(1) + new + target.group(3) + src[target.end():]
              open(fp,'w').write(src)
          PY
              ;;
            python)
              sed -i -E "s/^version *= *\"[^\"]+\"/version = \"${NEW}\"/" "$VERSION_FILE"
              ;;
            *)
              node -e "const fs=require('fs'),f=process.env.VERSION_FILE;const j=JSON.parse(fs.readFileSync(f));j.version=process.env.NEW;fs.writeFileSync(f,JSON.stringify(j,null,2)+'\n');"
              ;;
          esac

      # ---- Build ------------------------------------------------------
      - name: Build — Node.js / Angular
        if: matrix.tecnologia == 'nodejs' || matrix.tecnologia == 'angular' || matrix.tecnologia == 'react'
        working-directory: ${{ matrix.context }}
        run: |
          if [ -f package-lock.json ]; then npm ci  --legacy-peer-deps
          else                              npm install --legacy-peer-deps; fi
          if   npm run | grep -qE '^\s+build-homol' && [ "${{ inputs.target_env }}" = "homologacao" ]; then
            npm run build-homol
          elif npm run | grep -qE '^\s+build-prod'  && [ "${{ inputs.target_env }}" = "producao"    ]; then
            npm run build-prod
          else
            npm run build --if-present
          fi

      - name: Build — Maven
        if: matrix.tecnologia == 'spring-boot-java' || matrix.tecnologia == 'java'
        working-directory: ${{ matrix.context }}
        run: |
          if [ -x ./mvnw ]; then ./mvnw -B -DskipTests clean package
          else                  mvn   -B -DskipTests clean package; fi

      - name: Build — Python
        if: matrix.tecnologia == 'python'
        working-directory: ${{ matrix.context }}
        run: |
          python -m pip install --upgrade pip
          [ -f requirements.txt ] && pip install -r requirements.txt || true
          if [ -f pyproject.toml ]; then pip install build && python -m build; fi

      # ---- Commit do bump via REST API (bypass branch protection) --------
      - name: Commit do bump na branch
        env:
          NEW:           ${{ steps.ver.outputs.new }}
          REF:           ${{ needs.setup.outputs.ref }}
          VERSION_FILE:  ${{ matrix.version_file }}
          TEC:           ${{ matrix.tecnologia }}
          ENV_TARGET:    ${{ inputs.target_env }}
          GH_TOKEN_BUMP: ${{ secrets.GH_TOKEN_BUMP }}
          APP_TOKEN:     ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          # Ordem: App > PAT > GITHUB_TOKEN. O ultimo nao passa em
          # branch protegida, e so serve para repositorio sem protecao.
          export GH_TOKEN="${APP_TOKEN:-${GH_TOKEN_BUMP:-$GITHUB_TOKEN}}"

          python3 - <<'PY'
          import json, base64, re, os, subprocess, sys
          from urllib.parse import quote

          repo = os.environ['GITHUB_REPOSITORY']
          vf   = os.environ['VERSION_FILE']
          new  = os.environ['NEW']
          env  = os.environ['ENV_TARGET']
          ref  = os.environ['REF']
          tec  = os.environ['TEC']

          # URL-encode o ref para suportar branches com caracteres especiais (ex: feature/#1)
          ref_encoded = quote(ref, safe='/')

          # Ler conteudo atual e SHA da branch via API
          r = subprocess.run(
              ['gh', 'api', f'repos/{repo}/contents/{vf}?ref={ref_encoded}'],
              capture_output=True, check=True
          )
          data    = json.loads(r.stdout)
          sha     = data['sha']
          content = base64.b64decode(data['content']).decode('utf-8')

          # Aplicar nova versao
          if tec in ('spring-boot-java', 'java'):
              # Troca apenas o <version> do PROJETO (cabecalho, fora de <parent> e de dependencias)
              m_sec = re.search(r'<(?:properties|dependencies|dependencyManagement|build|profiles)[\s>]', content)
              header_end = m_sec.start() if m_sec else len(content)
              parent = re.search(r'<parent\b.*?</parent>', content, re.DOTALL)
              pspan = (parent.start(), parent.end()) if parent else None
              target = None
              for vm in re.finditer(r'(<version>)([^<]+)(</version>)', content):
                  if vm.start() >= header_end:
                      break
                  if pspan and pspan[0] <= vm.start() < pspan[1]:
                      continue
                  target = vm
                  break
              if target is None:
                  print('::error::Nao encontrei <version> do projeto no pom.xml.', file=sys.stderr)
                  sys.exit(1)
              updated = content[:target.start()] + target.group(1) + new + target.group(3) + content[target.end():]
          elif tec == 'python':
              updated = re.sub(r'^version *= *"[^"]*"', f'version = "{new}"', content, flags=re.MULTILINE)
          else:
              pkg = json.loads(content)
              pkg['version'] = new
              updated = json.dumps(pkg, indent=2) + '\n'

          if updated == content:
              print('::notice::Versao ja atualizada, nada a commitar.')
              sys.exit(0)

          # Commit via REST API — respeita admin bypass mesmo em branch protegida
          payload = json.dumps({
              'message': f'chore(release): bump {vf} -> {new} ({env}) [skip ci]',
              'content': base64.b64encode(updated.encode('utf-8')).decode(),
              'sha': sha,
              'branch': ref
          })
          r2 = subprocess.run(
              ['gh', 'api', '-X', 'PUT', f'repos/{repo}/contents/{vf}', '--input', '-'],
              input=payload.encode(), capture_output=True
          )
          if r2.returncode != 0:
              print(f'::error::Falha ao commitar bump: {r2.stderr.decode()}', file=sys.stderr)
              sys.exit(1)
          result = json.loads(r2.stdout)
          print(f'::notice::Bump commitado: {result["commit"]["sha"][:8]} — {vf} -> {new} ({env})')
          PY

      # ---- Credenciais AWS --------------------------------------------
      #
      # Dois passos mutuamente exclusivos, e nao um so com os dois modos:
      # a configure-aws-credentials, recebendo role E access key juntas, usa
      # a key para assumir a role, que nao e o que queremos.
      #
      # Basta definir a variavel AWS_DEPLOY_ROLE_ARN para o repositorio
      # passar a usar OIDC. Sem ela, segue no caminho antigo — o que permite
      # migrar um repositorio por vez sem tocar nos demais.
      - name: Credenciais AWS via OIDC
        if: vars.AWS_DEPLOY_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume:  ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: cd-${{ github.run_id }}
          aws-region:      ${{ env.AWS_REGION }}

      - name: Credenciais AWS via access key (legado, V6)
        if: vars.AWS_DEPLOY_ROLE_ARN == ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push imagem -> ECR
        env:
          REGISTRY:   ${{ steps.ecr.outputs.registry }}
          REPO:       ${{ matrix.componente }}
          NEW:        ${{ steps.ver.outputs.new }}
          ENV_TARGET: ${{ inputs.target_env }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          CONTEXT:    ${{ matrix.context }}
        run: |
          set -euo pipefail
          aws ecr describe-repositories --repository-names "$REPO" >/dev/null 2>&1 \
            || aws ecr create-repository --repository-name "$REPO" --image-scanning-configuration scanOnPush=true >/dev/null
          IMG="$REGISTRY/$REPO:$NEW"
          docker build -f "$DOCKERFILE" --build-arg ENV_TARGET="$ENV_TARGET" -t "$IMG" "$CONTEXT"
          docker push "$IMG"
          if [ "$ENV_TARGET" = "producao" ]; then
            docker tag "$IMG" "$REGISTRY/$REPO:latest"
            # Repos ECR com tag imutavel nao permitem sobrescrever 'latest'.
            # Removemos a tag antiga (se existir) e re-empurramos para a nova imagem:
            # em repo mutavel e inofensivo; em imutavel, destrava o push.
            # A imagem antiga permanece (ainda referenciada pela sua tag de versao).
            aws ecr batch-delete-image --repository-name "$REPO" \
              --image-ids imageTag=latest >/dev/null 2>&1 || true
            docker push "$REGISTRY/$REPO:latest"
          fi
          echo "IMAGE_URI=$IMG" >> "$GITHUB_ENV"

      # ---- GitHub Release (producao) ----------------------------------
      - name: Criar GitHub Release
        if: inputs.target_env == 'producao'
        env:
          NEW:           ${{ steps.ver.outputs.new }}
          COMP:          ${{ matrix.componente }}
          APP:           ${{ matrix.app }}
          MONO:          ${{ matrix.monorepo }}
          GH_TOKEN_BUMP: ${{ secrets.GH_TOKEN_BUMP }}
          APP_TOKEN:     ${{ steps.token.outputs.token }}
        run: |
          # Ordem: App > PAT > GITHUB_TOKEN. O ultimo nao passa em
          # branch protegida, e so serve para repositorio sem protecao.
          export GH_TOKEN="${APP_TOKEN:-${GH_TOKEN_BUMP:-$GITHUB_TOKEN}}"
          # Monorepo: prefixa a tag com a camada (ex.: api/1.97.0, web/1.92.0).
          # Single-repo: tag = numero puro (retrocompativel).
          if [ "$MONO" = "true" ]; then TAG="${APP}/${NEW}"; else TAG="$NEW"; fi
          gh release create "$TAG" \
            --title "Release $TAG" \
            --notes "Deploy de produção — \`$COMP:$NEW\`" \
            --latest

      # ---- Deploy SSH -------------------------------------------------
      - name: Configurar chave SSH
        if: inputs.deploy_platform == 'ec2'
        env:
          KEY_HOMOL:  ${{ secrets.SSH_KEY_HOMOL }}
          KEY_PROD:   ${{ secrets.SSH_KEY_PROD }}
          ENV_TARGET: ${{ inputs.target_env }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          if [ "$ENV_TARGET" = "producao" ]; then
            printf '%s\n' "$KEY_PROD"  > ~/.ssh/deploy_key
          else
            printf '%s\n' "$KEY_HOMOL" > ~/.ssh/deploy_key
          fi
          chmod 600 ~/.ssh/deploy_key

      - name: Deploy via SSH (EC2)
        if: inputs.deploy_platform == 'ec2'
        env:
          ENV_TARGET: ${{ inputs.target_env }}
          COMP:       ${{ matrix.componente }}
          NEW:        ${{ steps.ver.outputs.new }}
        run: |
          set -euo pipefail
          if [ "$ENV_TARGET" = "producao" ]; then
            HOST="ec2-user@ec2-18-230-19-215.sa-east-1.compute.amazonaws.com"
            SCRIPT="/home/ec2-user/deploy/deploy.sh"
          else
            HOST="ubuntu@54.232.76.143"
            SCRIPT="/home/ubuntu/deploy/deploy.sh"
          fi
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key "$HOST" \
            "$SCRIPT $COMP $NEW"

      - name: Deploy ECS
        if: inputs.deploy_platform == 'ecs'
        env:
          ENV_TARGET:   ${{ inputs.target_env }}
          SERVICO:      ${{ matrix.componente }}
          APP:          ${{ matrix.app }}
          IMAGEM:       ${{ env.IMAGE_URI }}
          CLUSTER_PROD:  ${{ vars.ECS_CLUSTER_PROD }}
          CLUSTER_HOMOL: ${{ vars.ECS_CLUSTER_HOMOL }}
        run: |
          set -euo pipefail

          if [ "$ENV_TARGET" = "producao" ]; then
            CLUSTER="$CLUSTER_PROD"; SUFIXO="prod"
          else
            CLUSTER="$CLUSTER_HOMOL"; SUFIXO="homol"
          fi
          if [ -z "$CLUSTER" ]; then
            echo "::error::Variavel ECS_CLUSTER_$(echo $SUFIXO | tr a-z A-Z) nao configurada. O deploy ECS precisa saber o cluster."
            exit 1
          fi
          FAMILIA="${SERVICO}-${SUFIXO}"

          # A familia da task definition e criada pelo Terraform, que usa
          # `ignore_changes = [task_definition]` justamente para a esteira
          # poder registrar revisoes sem conflito. Partimos da revisao ativa.
          echo "::group::Registrando nova revisao de $FAMILIA"
          aws ecs describe-task-definition --task-definition "$FAMILIA" \
            --query taskDefinition > /tmp/td-atual.json

          # Sobre a revisao ativa aplicamos a imagem nova e, se o repositorio
          # tiver `infra/deploy/<papel>/infra.yaml`, os campos que o contrato
          # declara. Sem o arquivo, o comportamento e o de sempre: so a imagem.
          #
          # O contrato manda apenas no que vive SO dentro da task definition —
          # cpu, memory, variaveis, segredos e command. Porta, health check,
          # roteamento, replicas e alarmes continuam com o Terraform, porque
          # cada um deles tambem alimenta um recurso que o Terraform gerencia.
          # Dois donos no mesmo campo produz divergencia silenciosa: a task
          # sobe numa porta e o target group aponta para outra, o health check
          # falha e o circuit breaker reverte parecendo deploy ruim.
          pip install --quiet pyyaml
          CONTRATO="infra/deploy/${APP}/infra.yaml" AMBIENTE="$SUFIXO" \
          python3 <<'PYEOF'
          import json, os, subprocess, sys

          TD_ATUAL, TD_NOVA = "/tmp/td-atual.json", "/tmp/td-nova.json"
          SERVICO  = os.environ["SERVICO"]
          IMAGEM   = os.environ["IMAGEM"]
          CONTRATO = os.environ["CONTRATO"]
          AMBIENTE = os.environ["AMBIENTE"]

          td = json.load(open(TD_ATUAL))
          for campo in ("taskDefinitionArn", "revision", "status", "requiresAttributes",
                        "compatibilities", "registeredAt", "registeredBy", "deregisteredAt"):
              td.pop(campo, None)

          alvos = [c for c in td.get("containerDefinitions", []) if c.get("name") == SERVICO]
          if not alvos:
              nomes = ", ".join(c.get("name", "?") for c in td.get("containerDefinitions", [])) or "(nenhum)"
              sys.exit(f"::error::Nenhum container chamado '{SERVICO}' na task definition. "
                       f"Containers presentes: {nomes}. O `componente` em .github/pipeline.yml "
                       f"precisa ser igual ao nome do container.")

          # A imagem so troca no container homonimo: init container e sidecar nao sao tocados.
          container = alvos[0]
          container["image"] = IMAGEM

          mudancas = []

          tem_contrato = os.path.isfile(CONTRATO)
          if not tem_contrato:
              print(f"::notice::{CONTRATO} nao existe — deploy troca apenas a imagem. "
                    f"A configuracao continua vindo do Terraform.")
          else:
              import yaml
              c = yaml.safe_load(open(CONTRATO, encoding="utf-8"))

              declarado = (c.get("metadata") or {}).get("component")
              if declarado != SERVICO:
                  sys.exit(f"::error::{CONTRATO} declara component '{declarado}', mas o deploy "
                           f"e do componente '{SERVICO}'. O contrato esta no diretorio errado.")

              rec = (c.get("resources") or {}).get(AMBIENTE) or {}
              for chave, campo in (("cpu", "cpu"), ("memory", "memory")):
                  novo = rec.get(chave)
                  if novo is None:
                      continue
                  novo = str(novo)                      # a API do ECS quer string
                  if td.get(campo) != novo:
                      mudancas.append(f"{campo}: {td.get(campo)} -> {novo}")
                      td[campo] = novo

              variaveis = (c.get("configmap") or {}).get("variables") or {}
              env_novo = sorted(
                  ({"name": k, "value": str(v[AMBIENTE])} for k, v in variaveis.items()
                   if isinstance(v, dict) and AMBIENTE in v),
                  key=lambda e: e["name"])
              env_antigo = sorted(container.get("environment", []), key=lambda e: e["name"])
              if env_antigo != env_novo:
                  antes = {e["name"] for e in env_antigo}
                  depois = {e["name"] for e in env_novo}
                  for n in sorted(depois - antes): mudancas.append(f"env + {n}")
                  for n in sorted(antes - depois): mudancas.append(f"env - {n}")
                  for n in sorted(antes & depois):
                      a = next(e["value"] for e in env_antigo if e["name"] == n)
                      d = next(e["value"] for e in env_novo if e["name"] == n)
                      if a != d: mudancas.append(f"env ~ {n}: {a} -> {d}")
                  container["environment"] = env_novo

              chaves = (c.get("secret") or {}).get("keys") or []
              if chaves:
                  app = (c.get("metadata") or {}).get("application")
                  nome_segredo = f"ebravo/{AMBIENTE}/{app}"
                  # DescribeSecret devolve o ARN; o sufixo aleatorio nao da para construir
                  # a partir do nome. Nao le valor — isso e GetSecretValue, que a role de
                  # deploy nao tem de proposito.
                  arn = subprocess.run(
                      ["aws", "secretsmanager", "describe-secret", "--secret-id", nome_segredo,
                       "--query", "ARN", "--output", "text"],
                      capture_output=True, text=True).stdout.strip()
                  if not arn.startswith("arn:"):
                      sys.exit(f"::error::Nao consegui resolver o ARN de {nome_segredo}. "
                               f"O segredo existe? A role de deploy tem secretsmanager:DescribeSecret?")
                  sec_novo = sorted(({"name": k, "valueFrom": f"{arn}:{k}::"} for k in chaves),
                                    key=lambda s: s["name"])
              else:
                  sec_novo = []
              sec_antigo = sorted(container.get("secrets", []), key=lambda s: s["name"])
              if sec_antigo != sec_novo:
                  antes = {s["name"] for s in sec_antigo}
                  depois = {s["name"] for s in sec_novo}
                  for n in sorted(depois - antes): mudancas.append(f"secret + {n}")
                  for n in sorted(antes - depois): mudancas.append(f"secret - {n}")
                  container["secrets"] = sec_novo

              cmd = (c.get("runtime") or {}).get("command")
              if cmd != container.get("command"):
                  mudancas.append(f"command: {container.get('command')} -> {cmd}")
                  if cmd: container["command"] = cmd
                  else:   container.pop("command", None)

          json.dump(td, open(TD_NOVA, "w"), indent=2)

          if mudancas:
              print("::group::Mudancas de configuracao vindas de " + CONTRATO)
              for m in mudancas:
                  print("  " + m)
              print("::endgroup::")
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
                  f.write(f"- config de `{CONTRATO}`: " + "; ".join(mudancas) + "\n")
          elif tem_contrato:
              print(f"::notice::Configuracao ja bate com {CONTRATO} — muda so a imagem.")
          PYEOF

          REV=$(aws ecs register-task-definition --cli-input-json file:///tmp/td-nova.json \
                  --query 'taskDefinition.revision' --output text)
          echo "::notice::Registrada $FAMILIA:$REV com $IMAGEM"
          echo "::endgroup::"

          aws ecs update-service --cluster "$CLUSTER" --service "$SERVICO" \
            --task-definition "$FAMILIA:$REV" >/dev/null
          echo "::notice::update-service disparado. Aguardando estabilizar..."

          # `|| true`: o wait falha por timeout de 10 min, mas tambem falha
          # quando o circuit breaker reverteu — a distincao vem da conferencia
          # abaixo, que e mais precisa.
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICO" || true

          # ESTE e o passo que impede um deploy verde mentiroso. O deployment
          # circuit breaker reverte sozinho quando a task nao passa no health
          # check; sem conferir a revisao, o workflow terminaria com sucesso
          # depois de um rollback. Aconteceu com grafana-prod:5.
          ATUAL=$(aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICO" \
                    --query 'services[0].taskDefinition' --output text)
          if [ "${ATUAL##*/}" != "$FAMILIA:$REV" ]; then
            echo "::error::O servico voltou para ${ATUAL##*/} em vez de $FAMILIA:$REV. O circuit breaker reverteu o deploy — a task nova nao passou no health check. Ver os logs em /ecs/$SERVICO no CloudWatch."
            exit 1
          fi

          RODANDO=$(aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICO" \
                      --query 'services[0].runningCount' --output text)
          echo "::notice::Deploy concluido: $FAMILIA:$REV com $RODANDO task(s) rodando."
          {
            echo "- ECS: \`$CLUSTER\` / \`$SERVICO\` -> \`$FAMILIA:$REV\`"
            echo "- tasks rodando: $RODANDO"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy GKE  (desativado)
        if: inputs.deploy_platform == 'gke'
        run: |
          echo "::warning::Deploy GKE ainda nao habilitado."
          # kubectl set image deployment/${{ matrix.componente }} ${{ matrix.componente }}=${IMAGE_URI}
          exit 0

      - name: Resumo
        if: always()
        run: |
          {
            echo "### Deploy ${{ inputs.target_env }}"
            echo ""
            echo "- componente: \`${{ matrix.componente }}\`"
            echo "- versao:     \`${{ steps.ver.outputs.new }}\`"
            echo "- imagem:     \`${IMAGE_URI:-n/a}\`"
            echo "- plataforma: \`${{ inputs.deploy_platform }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
