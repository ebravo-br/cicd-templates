# =====================================================================
#  CD - REUSABLE WORKFLOW (Build + ECR + Deploy SSH)
#
#  Este arquivo vive em:
#      ebravo-br/cicd-templates/.github/workflows/cd.yml
#
#  Invocado pelo stub de cada repo via:
#      jobs.cd.uses: ebravo-br/cicd-templates/.github/workflows/cd.yml@v1
#
#  Trigger: apenas workflow_dispatch (gate manual — deploy e sempre intencional).
#
#  Realiza em sequencia por componente (max-parallel: 1):
#    1. Bump de versao (calcula + atualiza arquivo local)
#    2. Build (compile/package ja com a nova versao)
#    3. Commit do bump [skip ci]
#    4. Build e push da imagem Docker -> ECR
#    5. Deploy SSH -> EC2
# =====================================================================

name: CD - Reusable (Build + ECR + Deploy)

on:
  workflow_call:
    inputs:
      target_env:
        description: 'homologacao | producao'
        type: string
        required: true
      deploy_platform:
        description: 'ec2 (ativo) | ecs | gke (futuros)'
        type: string
        required: false
        default: ec2
      deploy_apps:
        description: 'Componentes a deployar (monorepo): ambos | api | web'
        type: string
        required: false
        default: ambos
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      SSH_KEY_HOMOL:
        required: true
      SSH_KEY_PROD:
        required: true
      GH_TOKEN_BUMP:
        required: false

permissions:
  contents: write
  id-token: write
  pull-requests: write

env:
  AWS_REGION:     sa-east-1
  DEFAULT_NODE:   '20'
  DEFAULT_JDK:    '17'
  DEFAULT_PYTHON: '3.12'

jobs:
  # ===================================================================
  # 0. CHECK-PERMISSION — bloqueia deploy em producao se nao autorizado
  # ===================================================================
  check-permission:
    name: Verificar permissao
    runs-on: ubuntu-latest
    steps:
      - name: Bloquear deploy em producao para usuarios nao autorizados
        if: inputs.target_env == 'producao'
        env:
          ACTOR:   ${{ github.actor }}
          ALLOWED: ${{ vars.DEPLOY_PROD_ALLOWED }}
        run: |
          if [ -z "$ALLOWED" ]; then
            echo "::error::Variavel DEPLOY_PROD_ALLOWED nao configurada na org. Contate o administrador."
            exit 1
          fi
          if echo " $ALLOWED " | grep -qw "$ACTOR"; then
            echo "::notice::Permissao concedida: $ACTOR pode fazer deploy em producao."
          else
            echo "::error::Usuario '$ACTOR' nao tem permissao para deploy em producao. Lista de autorizados: $ALLOWED"
            exit 1
          fi

  # ===================================================================
  # 1. SETUP — le .github/pipeline.yml e monta a matrix
  # ===================================================================
  setup:
    name: Setup • parse .github/pipeline.yml
    needs: check-permission
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.props.outputs.matrix }}
      ref:    ${{ steps.ref.outputs.ref }}
    steps:
      - name: Definir ref de checkout
        id: ref
        run: |
          if [ "${{ github.event_name }}" = "pull_request_review" ]; then
            echo "ref=${{ github.event.pull_request.head.ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.ref }}

      - name: Parse .github/pipeline.yml -> matrix
        id: props
        shell: bash
        env:
          DEFAULT_PYTHON: ${{ env.DEFAULT_PYTHON }}
          DEPLOY_APPS:    ${{ inputs.deploy_apps }}
        run: |
          set -euo pipefail
          [ -f .github/pipeline.yml ] || { echo "::error::.github/pipeline.yml nao encontrado"; exit 1; }

          python3 - <<'PY'
          import yaml, json, os, sys

          cfg = yaml.safe_load(open('.github/pipeline.yml'))
          out = open(os.environ['GITHUB_OUTPUT'], 'a')
          dp  = os.environ.get('DEFAULT_PYTHON', '3.12')

          def g(d, *keys, default=''):
              for k in keys:
                  d = (d or {}).get(k)
                  if d is None:
                      return default
              return str(d) if d is not None else default

          def version_file(tec, base):
              m = {'spring-boot-java': 'pom.xml', 'java': 'pom.xml', 'python': 'pyproject.toml'}
              f = m.get(tec, 'package.json')
              return f'{base}/{f}'.lstrip('./')

          mono  = str(cfg.get('monorepo', False)).lower() == 'true'
          items = []

          if mono:
              deploy_apps_raw = os.environ.get('DEPLOY_APPS', 'ambos').strip().lower()
              deploy_apps = {'api', 'web'} if deploy_apps_raw == 'ambos' else {deploy_apps_raw}
              for app in ('api', 'web'):
                  if app not in deploy_apps:
                      continue
                  sub  = cfg.get(app) or {}
                  comp = g(sub, 'componente')
                  tec  = g(sub, 'tecnologia')
                  if not comp or not tec:
                      continue
                  df = f'infra/docker/{app}/Dockerfile'
                  if not os.path.isfile(df):
                      print(f'::error::{df} nao existe', file=sys.stderr); sys.exit(1)
                  items.append({
                      'app': app, 'componente': comp, 'tecnologia': tec,
                      'node': g(sub,'node'), 'jdk': g(sub,'jdk'),
                      'python': g(sub,'python') or dp,
                      'context': f'apps/{app}', 'dockerfile': df,
                      'version_file': version_file(tec, f'apps/{app}'),
                  })
          else:
              comp = g(cfg, 'componente')
              tec  = g(cfg, 'tecnologia')
              if not comp: print('::error::componente ausente em .github/pipeline.yml', file=sys.stderr); sys.exit(1)
              if not tec:  print('::error::tecnologia ausente em .github/pipeline.yml', file=sys.stderr); sys.exit(1)
              if os.path.isfile('infra/docker/Dockerfile'):
                  df  = 'infra/docker/Dockerfile'
                  app = 'api' if tec in ('spring-boot-java', 'java', 'python') else 'web'
              elif os.path.isfile('infra/docker/api/Dockerfile'):
                  df, app = 'infra/docker/api/Dockerfile', 'api'
              elif os.path.isfile('infra/docker/web/Dockerfile'):
                  df, app = 'infra/docker/web/Dockerfile', 'web'
              else:
                  print('::error::Dockerfile nao encontrado. Esperado: infra/docker/Dockerfile', file=sys.stderr); sys.exit(1)
              items.append({
                  'app': app, 'componente': comp, 'tecnologia': tec,
                  'node': g(cfg,'node'), 'jdk': g(cfg,'jdk'),
                  'python': g(cfg,'python') or dp,
                  'context': '.', 'dockerfile': df,
                  'version_file': version_file(tec, '.'),
              })

          if not items:
              print('::error::nenhum componente em .github/pipeline.yml', file=sys.stderr); sys.exit(1)

          out.write(f"matrix={json.dumps({'include': items})}\n")
          print(json.dumps({'include': items}, indent=2))
          PY

  # ===================================================================
  # 2. DEPLOY — build + bump + ECR + SSH (um componente por vez)
  # ===================================================================
  deploy:
    name: Deploy ${{ inputs.target_env }} • ${{ matrix.componente }}
    needs: [check-permission, setup]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    environment:
      name: ${{ inputs.target_env }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.setup.outputs.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar identidade Git
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      # ---- Toolchain --------------------------------------------------
      - if: matrix.tecnologia == 'nodejs' || matrix.tecnologia == 'angular' || matrix.tecnologia == 'react'
        id: nodever
        run: |
          NV="${{ matrix.node }}"; NV="${NV#node}"
          echo "v=${NV:-${{ env.DEFAULT_NODE }}}" >> "$GITHUB_OUTPUT"

      - if: matrix.tecnologia == 'nodejs' || matrix.tecnologia == 'angular' || matrix.tecnologia == 'react'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.nodever.outputs.v }}

      - if: matrix.tecnologia == 'spring-boot-java' || matrix.tecnologia == 'java'
        id: jdkver
        run: |
          JV="${{ matrix.jdk }}"; JV="${JV#jdk}"
          echo "v=${JV:-${{ env.DEFAULT_JDK }}}" >> "$GITHUB_OUTPUT"

      - if: matrix.tecnologia == 'spring-boot-java' || matrix.tecnologia == 'java'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.jdkver.outputs.v }}
          cache: maven

      - if: matrix.tecnologia == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # ---- Bump de versao ---------------------------------------------
      - name: Calcular nova versao
        id: ver
        env:
          VERSION_FILE: ${{ matrix.version_file }}
          TEC:          ${{ matrix.tecnologia }}
          ENV_TARGET:   ${{ inputs.target_env }}
        run: |
          set -euo pipefail
          STAMP=$(TZ=America/Sao_Paulo date +'%d%m%y%H%M%S')
          case "$TEC" in
            spring-boot-java|java) CUR=$(grep -m1 -oP '(?<=<version>)[^<]+' "$VERSION_FILE") ;;
            python)                CUR=$(grep -m1 -oP '(?<=^version *= *")[^"]+' "$VERSION_FILE") ;;
            *)                     CUR=$(node -p "require('./'+process.env.VERSION_FILE).version") ;;
          esac
          BASE=$(echo "$CUR" | sed -E 's/-SNAPSHOT_[0-9]+$//')
          if [ "$ENV_TARGET" = "homologacao" ]; then
            NEW="${BASE}-SNAPSHOT_${STAMP}"
          else
            IFS='.' read -r A B C <<<"$BASE"
            NEW="${A}.$((B+1)).0"
          fi
          echo "current=$CUR" >> "$GITHUB_OUTPUT"
          echo "new=$NEW"     >> "$GITHUB_OUTPUT"
          echo "::notice::$VERSION_FILE  $CUR -> $NEW  ($ENV_TARGET)"

      - name: Atualizar arquivo de versao
        env:
          VERSION_FILE: ${{ matrix.version_file }}
          TEC:          ${{ matrix.tecnologia }}
          NEW:          ${{ steps.ver.outputs.new }}
        run: |
          set -euo pipefail
          case "$TEC" in
            spring-boot-java|java)
              python3 - <<'PY'
          import os, re
          fp = os.environ['VERSION_FILE']; new = os.environ['NEW']
          src = open(fp).read()
          src = re.sub(r'(<project[^>]*>.*?<version>)([^<]+)(</version>)',
                       lambda m: m.group(1)+new+m.group(3),
                       src, count=1, flags=re.DOTALL)
          open(fp,'w').write(src)
          PY
              ;;
            python)
              sed -i -E "s/^version *= *\"[^\"]+\"/version = \"${NEW}\"/" "$VERSION_FILE"
              ;;
            *)
              node -e "const fs=require('fs'),f=process.env.VERSION_FILE;const j=JSON.parse(fs.readFileSync(f));j.version=process.env.NEW;fs.writeFileSync(f,JSON.stringify(j,null,2)+'\n');"
              ;;
          esac

      # ---- Build ------------------------------------------------------
      - name: Build — Node.js / Angular
        if: matrix.tecnologia == 'nodejs' || matrix.tecnologia == 'angular' || matrix.tecnologia == 'react'
        working-directory: ${{ matrix.context }}
        run: |
          if [ -f package-lock.json ]; then npm ci  --legacy-peer-deps
          else                              npm install --legacy-peer-deps; fi
          if   npm run | grep -qE '^\s+build-homol' && [ "${{ inputs.target_env }}" = "homologacao" ]; then
            npm run build-homol
          elif npm run | grep -qE '^\s+build-prod'  && [ "${{ inputs.target_env }}" = "producao"    ]; then
            npm run build-prod
          else
            npm run build --if-present
          fi

      - name: Build — Maven
        if: matrix.tecnologia == 'spring-boot-java' || matrix.tecnologia == 'java'
        working-directory: ${{ matrix.context }}
        run: |
          if [ -x ./mvnw ]; then ./mvnw -B -DskipTests clean package
          else                  mvn   -B -DskipTests clean package; fi

      - name: Build — Python
        if: matrix.tecnologia == 'python'
        working-directory: ${{ matrix.context }}
        run: |
          python -m pip install --upgrade pip
          [ -f requirements.txt ] && pip install -r requirements.txt || true
          if [ -f pyproject.toml ]; then pip install build && python -m build; fi

      # ---- Commit do bump via REST API (bypass branch protection) --------
      - name: Commit do bump na branch
        env:
          NEW:           ${{ steps.ver.outputs.new }}
          REF:           ${{ needs.setup.outputs.ref }}
          VERSION_FILE:  ${{ matrix.version_file }}
          TEC:           ${{ matrix.tecnologia }}
          ENV_TARGET:    ${{ inputs.target_env }}
          GH_TOKEN_BUMP: ${{ secrets.GH_TOKEN_BUMP }}
        run: |
          set -euo pipefail
          export GH_TOKEN="${GH_TOKEN_BUMP:-$GITHUB_TOKEN}"

          python3 - <<'PY'
          import json, base64, re, os, subprocess, sys
          from urllib.parse import quote

          repo = os.environ['GITHUB_REPOSITORY']
          vf   = os.environ['VERSION_FILE']
          new  = os.environ['NEW']
          env  = os.environ['ENV_TARGET']
          ref  = os.environ['REF']
          tec  = os.environ['TEC']

          # URL-encode o ref para suportar branches com caracteres especiais (ex: feature/#1)
          ref_encoded = quote(ref, safe='/')

          # Ler conteudo atual e SHA da branch via API
          r = subprocess.run(
              ['gh', 'api', f'repos/{repo}/contents/{vf}?ref={ref_encoded}'],
              capture_output=True, check=True
          )
          data    = json.loads(r.stdout)
          sha     = data['sha']
          content = base64.b64decode(data['content']).decode('utf-8')

          # Aplicar nova versao
          if tec in ('spring-boot-java', 'java'):
              updated = re.sub(
                  r'(<project[^>]*>.*?<version>)[^<]+(</version>)',
                  lambda m: m.group(1) + new + m.group(2),
                  content, count=1, flags=re.DOTALL
              )
          elif tec == 'python':
              updated = re.sub(r'^version *= *"[^"]*"', f'version = "{new}"', content, flags=re.MULTILINE)
          else:
              pkg = json.loads(content)
              pkg['version'] = new
              updated = json.dumps(pkg, indent=2) + '\n'

          if updated == content:
              print('::notice::Versao ja atualizada, nada a commitar.')
              sys.exit(0)

          # Commit via REST API — respeita admin bypass mesmo em branch protegida
          payload = json.dumps({
              'message': f'chore(release): bump {vf} -> {new} ({env}) [skip ci]',
              'content': base64.b64encode(updated.encode('utf-8')).decode(),
              'sha': sha,
              'branch': ref
          })
          r2 = subprocess.run(
              ['gh', 'api', '-X', 'PUT', f'repos/{repo}/contents/{vf}', '--input', '-'],
              input=payload.encode(), capture_output=True
          )
          if r2.returncode != 0:
              print(f'::error::Falha ao commitar bump: {r2.stderr.decode()}', file=sys.stderr)
              sys.exit(1)
          result = json.loads(r2.stdout)
          print(f'::notice::Bump commitado: {result["commit"]["sha"][:8]} — {vf} -> {new} ({env})')
          PY

      # ---- ECR --------------------------------------------------------
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push imagem -> ECR
        env:
          REGISTRY:   ${{ steps.ecr.outputs.registry }}
          REPO:       ${{ matrix.componente }}
          NEW:        ${{ steps.ver.outputs.new }}
          ENV_TARGET: ${{ inputs.target_env }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          CONTEXT:    ${{ matrix.context }}
        run: |
          set -euo pipefail
          aws ecr describe-repositories --repository-names "$REPO" >/dev/null 2>&1 \
            || aws ecr create-repository --repository-name "$REPO" --image-scanning-configuration scanOnPush=true >/dev/null
          IMG="$REGISTRY/$REPO:$NEW"
          docker build -f "$DOCKERFILE" -t "$IMG" "$CONTEXT"
          docker push "$IMG"
          if [ "$ENV_TARGET" = "producao" ]; then
            docker tag  "$IMG" "$REGISTRY/$REPO:latest"
            docker push "$REGISTRY/$REPO:latest"
          fi
          echo "IMAGE_URI=$IMG" >> "$GITHUB_ENV"

      # ---- GitHub Release (producao) ----------------------------------
      - name: Criar GitHub Release
        if: inputs.target_env == 'producao'
        env:
          NEW:           ${{ steps.ver.outputs.new }}
          COMP:          ${{ matrix.componente }}
          GH_TOKEN_BUMP: ${{ secrets.GH_TOKEN_BUMP }}
        run: |
          export GH_TOKEN="${GH_TOKEN_BUMP:-$GITHUB_TOKEN}"
          gh release create "$NEW" \
            --title "Release $NEW" \
            --notes "Deploy de produção — \`$COMP:$NEW\`" \
            --latest

      # ---- Deploy SSH -------------------------------------------------
      - name: Configurar chave SSH
        env:
          KEY_HOMOL:  ${{ secrets.SSH_KEY_HOMOL }}
          KEY_PROD:   ${{ secrets.SSH_KEY_PROD }}
          ENV_TARGET: ${{ inputs.target_env }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          if [ "$ENV_TARGET" = "producao" ]; then
            printf '%s\n' "$KEY_PROD"  > ~/.ssh/deploy_key
          else
            printf '%s\n' "$KEY_HOMOL" > ~/.ssh/deploy_key
          fi
          chmod 600 ~/.ssh/deploy_key

      - name: Deploy via SSH (EC2)
        if: inputs.deploy_platform == 'ec2'
        env:
          ENV_TARGET: ${{ inputs.target_env }}
          COMP:       ${{ matrix.componente }}
          NEW:        ${{ steps.ver.outputs.new }}
        run: |
          set -euo pipefail
          if [ "$ENV_TARGET" = "producao" ]; then
            HOST="ec2-user@ec2-18-230-19-215.sa-east-1.compute.amazonaws.com"
            SCRIPT="/home/ec2-user/deploy/deploy.sh"
          else
            HOST="ubuntu@54.232.76.143"
            SCRIPT="/home/ubuntu/deploy/deploy.sh"
          fi
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key "$HOST" \
            "$SCRIPT $COMP $NEW"

      - name: Deploy ECS  (desativado)
        if: inputs.deploy_platform == 'ecs'
        run: |
          echo "::warning::Deploy ECS ainda nao habilitado."
          # aws ecs update-service --cluster <C> --service ${{ matrix.componente }} --force-new-deployment
          exit 0

      - name: Deploy GKE  (desativado)
        if: inputs.deploy_platform == 'gke'
        run: |
          echo "::warning::Deploy GKE ainda nao habilitado."
          # kubectl set image deployment/${{ matrix.componente }} ${{ matrix.componente }}=${IMAGE_URI}
          exit 0

      - name: Resumo
        if: always()
        run: |
          {
            echo "### Deploy ${{ inputs.target_env }}"
            echo ""
            echo "- componente: \`${{ matrix.componente }}\`"
            echo "- versao:     \`${{ steps.ver.outputs.new }}\`"
            echo "- imagem:     \`${IMAGE_URI:-n/a}\`"
            echo "- plataforma: \`${{ inputs.deploy_platform }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
