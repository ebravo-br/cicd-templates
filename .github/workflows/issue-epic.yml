# =====================================================================
#  ISSUE EPIC ASSIGNMENT - REUSABLE WORKFLOW
#
#  Este arquivo vive em:
#      ebravo-br/cicd-templates/.github/workflows/issue-epic.yml
#
#  Invocado pelo stub de cada repo via:
#      jobs.epic.uses: ebravo-br/cicd-templates/.github/workflows/issue-epic.yml@v1
#
#  Funciona cross-org: qualquer repo de ebravo-br ou tramar-br pode
#  invocar este workflow. As issues caem no projeto "Ebravo Projetos"
#  (numero 2, owner ebravo-br).
#
#  Comportamento ao criar uma nova Issue:
#    1. Adiciona a issue ao projeto "Ebravo Projetos"
#    2. Define Status = "Backlog"
#    3. Define campo "Épico" com base em:
#         owner = tramar-br        ->  TRAMAR
#         nome  prefixo ebdocs-*   ->  EBDOCS
#         nome  prefixo ebcare-*   ->  EBCARE
#         nome  prefixo tramar-*   ->  TRAMAR
#         nome  prefixo cemiterio* ->  CEMITERIO
#         nome  prefixo ers-*      ->  ERS
#         nome  contem  atos       ->  ATOS
#         nome  prefixo datapat-*  ->  DATAPAT
#         nome  prefixo totem-*    ->  TOTEM
#         nome  prefixo acg-*      ->  ACG
#         nome  prefixo sensive-*  ->  SENSIVE
#         (sem match) -> apenas adiciona ao projeto sem definir épico
#
#  Auth: PROJECT_PAT (PAT classico, escopo project + repo + read:org).
#    - Org secret necessario na org do CALLER (ebravo-br e tramar-br).
#    - PAT scoped no usuario que e membro das duas orgs — necessario
#      para resolver issue de uma org e mutar project de outra org
#      numa mesma chamada (limitacao do GitHub Apps).
#    - Stubs cross-org passam PROJECT_PAT explicitamente; secrets:inherit
#      nao funciona em chamada cross-org de reusable workflow.
# =====================================================================
name: Issue Epic Assignment - Reusable

on:
  workflow_call:
    secrets:
      PROJECT_PAT:
        required: true

permissions:
  contents: read

env:
  PROJECT_NUMBER: "2"
  PROJECT_ORG:    "ebravo-br"

jobs:
  assign-epic:
    name: Atribuir épico à issue
    runs-on: ubuntu-latest
    steps:
      - name: Detectar épico pelo owner/nome do repo
        id: epic
        run: |
          OWNER="${{ github.event.repository.owner.login }}"
          REPO_NAME="${{ github.event.repository.name }}"
          REPO_LC="${REPO_NAME,,}"
          if   [ "$OWNER" = "tramar-br" ];          then echo "epic=TRAMAR"    >> "$GITHUB_OUTPUT"
          elif [[ "$REPO_LC" == ebdocs* ]];         then echo "epic=EBDOCS"    >> "$GITHUB_OUTPUT"
          elif [[ "$REPO_LC" == ebcare* ]];         then echo "epic=EBCARE"    >> "$GITHUB_OUTPUT"
          elif [[ "$REPO_LC" == tramar* ]];         then echo "epic=TRAMAR"    >> "$GITHUB_OUTPUT"
          elif [[ "$REPO_LC" == cemiterio* ]];      then echo "epic=CEMITERIO" >> "$GITHUB_OUTPUT"
          elif [[ "$REPO_LC" == ers* ]];            then echo "epic=ERS"       >> "$GITHUB_OUTPUT"
          elif [[ "$REPO_LC" == *atos* ]];          then echo "epic=ATOS"      >> "$GITHUB_OUTPUT"
          elif [[ "$REPO_LC" == datapat* ]];        then echo "epic=DATAPAT"   >> "$GITHUB_OUTPUT"
          elif [[ "$REPO_LC" == totem* ]];          then echo "epic=TOTEM"     >> "$GITHUB_OUTPUT"
          elif [[ "$REPO_LC" == acg* ]];            then echo "epic=ACG"       >> "$GITHUB_OUTPUT"
          elif [[ "$REPO_LC" == sensive* ]];        then echo "epic=SENSIVE"   >> "$GITHUB_OUTPUT"
          else echo "epic=" >> "$GITHUB_OUTPUT"
          fi

      - name: Adicionar issue ao projeto e atribuir épico
        env:
          GH_TOKEN:       ${{ secrets.PROJECT_PAT }}
          EPIC:           ${{ steps.epic.outputs.epic }}
          ISSUE_ID:       ${{ github.event.issue.node_id }}
          ISSUE_NUMBER:   ${{ github.event.issue.number }}
          ORG:            ${{ env.PROJECT_ORG }}
          PROJECT_NUMBER: ${{ env.PROJECT_NUMBER }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os, subprocess, json, sys

          epic           = os.environ.get('EPIC', '')
          issue_id       = os.environ['ISSUE_ID']
          issue_number   = os.environ['ISSUE_NUMBER']
          org            = os.environ['ORG']
          project_number = int(os.environ['PROJECT_NUMBER'])

          def gql(query, variables=None):
              payload = json.dumps({'query': query, 'variables': variables or {}})
              r = subprocess.run(
                  ['gh', 'api', 'graphql', '--input', '-'],
                  input=payload.encode(), capture_output=True
              )
              data = json.loads(r.stdout)
              if 'errors' in data:
                  print(f'::error::GraphQL: {data["errors"]}', file=sys.stderr)
                  sys.exit(1)
              return data['data']

          # Buscar projeto, campo Status e campo Épico
          proj_data = gql('''
            query($org: String!, $num: Int!) {
              organization(login: $org) {
                projectV2(number: $num) {
                  id
                  fields(first: 20) {
                    nodes {
                      ... on ProjectV2SingleSelectField {
                        id name
                        options { id name }
                      }
                    }
                  }
                }
              }
            }
          ''', {'org': org, 'num': project_number})

          project    = proj_data['organization']['projectV2']
          project_id = project['id']

          def find_field(name):
              return next(
                  (f for f in project['fields']['nodes'] if f.get('name') == name),
                  None
              )

          status_field = find_field('Status')
          epic_field   = find_field('Épico')

          # Adicionar issue ao projeto (cross-org: PAT do usuario ve a
          # issue de qualquer org da qual ele e membro).
          add_data = gql('''
            mutation($projectId: ID!, $contentId: ID!) {
              addProjectV2ItemById(input: {
                projectId: $projectId, contentId: $contentId
              }) { item { id } }
            }
          ''', {'projectId': project_id, 'contentId': issue_id})
          item_id = add_data['addProjectV2ItemById']['item']['id']
          print(f'::notice::Issue #{issue_number} adicionada ao projeto.')

          def set_field(field, option_name, label):
              if not field:
                  print(f'::warning::Campo "{label}" nao encontrado no projeto.')
                  return
              opt = next(
                  (o for o in field['options']
                   if o['name'].lower() == option_name.lower()),
                  None
              )
              if not opt:
                  print(f'::warning::Opcao "{option_name}" nao encontrada em "{label}".')
                  return
              gql('''
                mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                  updateProjectV2ItemFieldValue(input: {
                    projectId: $projectId, itemId: $itemId, fieldId: $fieldId,
                    value: { singleSelectOptionId: $optionId }
                  }) { projectV2Item { id } }
                }
              ''', {
                'projectId': project_id, 'itemId': item_id,
                'fieldId': field['id'], 'optionId': opt['id']
              })
              print(f'::notice::Issue #{issue_number} {label} -> "{option_name}".')

          set_field(status_field, 'Backlog', 'Status')

          if epic:
              set_field(epic_field, epic, 'Épico')
          else:
              print(f'::notice::Nenhum épico mapeado para este repositório.')
          PY
