# =====================================================================
#  ROLLBACK - REUSABLE WORKFLOW
#
#  Este arquivo vive em:
#      ebravo-br/cicd-templates/.github/workflows/rollback.yml
#
#  Invocado pelo stub de cada repo via:
#      jobs.rollback.uses: ebravo-br/cicd-templates/.github/workflows/rollback.yml@v1
#
#  Deploy em producao requer usuario listado em DEPLOY_PROD_ALLOWED (org var).
# =====================================================================

name: Rollback - Reusable

on:
  workflow_call:
    inputs:
      image_tag:
        description: 'Nome da imagem para rollback (ex: 1.5.0)'
        type: string
        required: true
      target_env:
        description: 'homologacao | producao'
        type: string
        required: true
      deploy_platform:
        description: 'ec2 (ativo) | ecs | gke (futuros)'
        type: string
        required: false
        default: ec2
      deploy_apps:
        description: 'Componentes a fazer rollback (monorepo): ambos | api | web'
        type: string
        required: false
        default: ambos
    secrets:
      # Opcionais desde o v2: com OIDC nao existem access keys, e so o
      # caminho `ec2` usa SSH. Ver V6 em ebravo-br/ebravo-infra, docs/05.
      AWS_ACCESS_KEY_ID:     { required: false }
      AWS_SECRET_ACCESS_KEY: { required: false }
      SSH_KEY_HOMOL:         { required: false }
      SSH_KEY_PROD:          { required: false }

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: sa-east-1

jobs:
  # ===================================================================
  # 0. CHECK-PERMISSION
  # ===================================================================
  check-permission:
    name: Verificar permissao
    runs-on: ubuntu-latest
    steps:
      - name: Bloquear rollback em producao para usuarios nao autorizados
        if: inputs.target_env == 'producao'
        env:
          ACTOR:   ${{ github.actor }}
          ALLOWED: ${{ vars.DEPLOY_PROD_ALLOWED }}
        run: |
          if [ -z "$ALLOWED" ]; then
            echo "::error::Variavel DEPLOY_PROD_ALLOWED nao configurada na org. Contate o administrador."
            exit 1
          fi
          if echo " $ALLOWED " | grep -qw "$ACTOR"; then
            echo "::notice::Permissao concedida: $ACTOR pode fazer rollback em producao."
          else
            echo "::error::Usuario '$ACTOR' nao tem permissao para rollback em producao. Lista de autorizados: $ALLOWED"
            exit 1
          fi

  # ===================================================================
  # 1. SETUP — le .github/pipeline.yml e monta a matrix
  # ===================================================================
  setup:
    name: Setup • parse .github/pipeline.yml
    needs: check-permission
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.props.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Parse .github/pipeline.yml -> matrix
        id: props
        shell: bash
        env:
          DEPLOY_APPS: ${{ inputs.deploy_apps }}
        run: |
          set -euo pipefail
          [ -f .github/pipeline.yml ] || { echo "::error::.github/pipeline.yml nao encontrado"; exit 1; }

          python3 - <<'PY'
          import yaml, json, os, sys

          cfg = yaml.safe_load(open('.github/pipeline.yml'))
          out = open(os.environ['GITHUB_OUTPUT'], 'a')

          def g(d, *keys, default=''):
              for k in keys:
                  d = (d or {}).get(k)
                  if d is None: return default
              return str(d) if d is not None else default

          mono  = str(cfg.get('monorepo', False)).lower() == 'true'
          items = []

          if mono:
              deploy_apps_raw = os.environ.get('DEPLOY_APPS', 'ambos').strip().lower()
              deploy_apps = {'api', 'web'} if deploy_apps_raw == 'ambos' else {deploy_apps_raw}
              for app in ('api', 'web'):
                  if app not in deploy_apps:
                      continue
                  sub  = cfg.get(app) or {}
                  comp = g(sub, 'componente')
                  if comp:
                      items.append({'app': app, 'componente': comp})
          else:
              comp = g(cfg, 'componente')
              if not comp:
                  print('::error::componente ausente em .github/pipeline.yml', file=sys.stderr); sys.exit(1)
              items.append({'app': 'main', 'componente': comp})

          if not items:
              print('::error::nenhum componente em .github/pipeline.yml', file=sys.stderr); sys.exit(1)

          out.write(f"matrix={json.dumps({'include': items})}\n")
          print(json.dumps({'include': items}, indent=2))
          PY

  # ===================================================================
  # 2. ROLLBACK — valida tag no ECR e faz deploy via SSH
  # ===================================================================
  rollback:
    name: Rollback ${{ inputs.target_env }} • ${{ matrix.componente }}
    needs: [check-permission, setup]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    steps:
      - name: Credenciais AWS via OIDC
        if: vars.AWS_DEPLOY_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume:    ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: rollback-${{ github.run_id }}
          aws-region:        ${{ env.AWS_REGION }}

      - name: Credenciais AWS via access key (legado, V6)
        if: vars.AWS_DEPLOY_ROLE_ARN == ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ---- Validar tag no ECR -----------------------------------------
      - name: Validar tag no ECR
        env:
          REPO: ${{ matrix.componente }}
          TAG:  ${{ inputs.image_tag }}
        run: |
          set -euo pipefail

          # Guarda explicita: com TAG vazia o `--image-ids imageTag=` falha
          # na validacao de parametro do proprio CLI, e a mensagem que
          # chegava ao usuario era sobre sintaxe, nao sobre a tag faltando.
          if [ -z "${TAG// /}" ]; then
            echo "::error::A tag da imagem esta vazia. Informe a versao para a qual voltar, por exemplo 1.5.0."
            exit 1
          fi

          FOUND=$(aws ecr describe-images --repository-name "$REPO" \
            --image-ids imageTag="$TAG" \
            --query 'imageDetails[0].imageTags[0]' \
            --output text 2>/dev/null || echo "NONE")
          if [ "$FOUND" = "NONE" ] || [ -z "$FOUND" ]; then
            echo "::error::Imagem '$TAG' nao encontrada no ECR para o repositorio '$REPO'. Verifique a tag informada e tente novamente."
            exit 1
          fi
          echo "::notice::Imagem '$TAG' encontrada no ECR. Iniciando rollback em ${{ inputs.target_env }}."

      # ---- Configurar chave SSH ----------------------------------------
      - name: Configurar chave SSH
        if: inputs.deploy_platform == 'ec2'
        env:
          KEY_HOMOL:  ${{ secrets.SSH_KEY_HOMOL }}
          KEY_PROD:   ${{ secrets.SSH_KEY_PROD }}
          ENV_TARGET: ${{ inputs.target_env }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          if [ "$ENV_TARGET" = "producao" ]; then
            printf '%s\n' "$KEY_PROD"  > ~/.ssh/deploy_key
          else
            printf '%s\n' "$KEY_HOMOL" > ~/.ssh/deploy_key
          fi
          chmod 600 ~/.ssh/deploy_key

      # ---- Deploy SSH --------------------------------------------------
      - name: Rollback via SSH (EC2)
        if: inputs.deploy_platform == 'ec2'
        env:
          ENV_TARGET: ${{ inputs.target_env }}
          COMP:       ${{ matrix.componente }}
          TAG:        ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          if [ "$ENV_TARGET" = "producao" ]; then
            HOST="ec2-user@ec2-18-230-19-215.sa-east-1.compute.amazonaws.com"
            SCRIPT="/home/ec2-user/deploy/deploy.sh"
          else
            HOST="ubuntu@54.232.76.143"
            SCRIPT="/home/ubuntu/deploy/deploy.sh"
          fi
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key "$HOST" \
            "$SCRIPT $COMP $TAG"

      # Mesma mecanica do deploy, com a imagem vinda da tag informada em vez
      # de um build novo. Nada e reconstruido — volta-se a um artefato que
      # ja existe no ECR, que e o que torna o rollback rapido e previsivel.
      - name: Rollback ECS
        if: inputs.deploy_platform == 'ecs'
        env:
          ENV_TARGET:    ${{ inputs.target_env }}
          SERVICO:       ${{ matrix.componente }}
          TAG:           ${{ inputs.image_tag }}
          REGISTRY:      ${{ steps.ecr.outputs.registry }}
          CLUSTER_PROD:  ${{ vars.ECS_CLUSTER_PROD }}
          CLUSTER_HOMOL: ${{ vars.ECS_CLUSTER_HOMOL }}
        run: |
          set -euo pipefail

          if [ "$ENV_TARGET" = "producao" ]; then
            CLUSTER="$CLUSTER_PROD"; SUFIXO="prod"
          else
            CLUSTER="$CLUSTER_HOMOL"; SUFIXO="homol"
          fi
          if [ -z "$CLUSTER" ]; then
            echo "::error::Variavel ECS_CLUSTER_$(echo $SUFIXO | tr a-z A-Z) nao configurada. O rollback ECS precisa saber o cluster."
            exit 1
          fi
          FAMILIA="${SERVICO}-${SUFIXO}"
          IMAGEM="$REGISTRY/$SERVICO:$TAG"

          aws ecs describe-task-definition --task-definition "$FAMILIA" \
            --query taskDefinition > /tmp/td-atual.json

          jq --arg img "$IMAGEM" --arg c "$SERVICO" '
            .containerDefinitions = (.containerDefinitions
              | map(if .name == $c then .image = $img else . end))
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                  .compatibilities, .registeredAt, .registeredBy,
                  .deregisteredAt)
          ' /tmp/td-atual.json > /tmp/td-nova.json

          if ! jq -e --arg img "$IMAGEM" \
               'any(.containerDefinitions[]; .image == $img)' /tmp/td-nova.json >/dev/null; then
            echo "::error::Nenhum container chamado '$SERVICO' na familia '$FAMILIA'."
            exit 1
          fi

          REV=$(aws ecs register-task-definition --cli-input-json file:///tmp/td-nova.json \
                  --query 'taskDefinition.revision' --output text)
          echo "::notice::Registrada $FAMILIA:$REV apontando para $IMAGEM"

          aws ecs update-service --cluster "$CLUSTER" --service "$SERVICO" \
            --task-definition "$FAMILIA:$REV" >/dev/null
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICO" || true

          # Num rollback, um circuit breaker que reverte e especialmente
          # grave: significa que nem a versao anterior sobe. Falhar aqui e o
          # que faz o operador procurar o log em vez de assumir que resolveu.
          ATUAL=$(aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICO" \
                    --query 'services[0].taskDefinition' --output text)
          if [ "${ATUAL##*/}" != "$FAMILIA:$REV" ]; then
            echo "::error::O servico voltou para ${ATUAL##*/} em vez de $FAMILIA:$REV. Nem a versao '$TAG' passou no health check. Ver /ecs/$SERVICO no CloudWatch."
            exit 1
          fi
          echo "::notice::Rollback concluido: $SERVICO em $TAG ($FAMILIA:$REV)."
          echo "- ECS: \`$CLUSTER\` / \`$SERVICO\` -> \`$FAMILIA:$REV\` (\`$TAG\`)" >> "$GITHUB_STEP_SUMMARY"

      - name: Rollback GKE  (desativado)
        if: inputs.deploy_platform == 'gke'
        run: echo "::warning::Rollback GKE ainda nao habilitado." && exit 0

      # ---- Resumo -----------------------------------------------------
      - name: Resumo
        if: always()
        run: |
          {
            echo "### Rollback ${{ inputs.target_env }}"
            echo ""
            echo "- componente: \`${{ matrix.componente }}\`"
            echo "- tag:        \`${{ inputs.image_tag }}\`"
            echo "- plataforma: \`${{ inputs.deploy_platform }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
